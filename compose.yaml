# lebenslinien (Repo https://github.com/EdgarM73/LebensLinien)
# Produktiv: Komodo-Stack "lebenslinien". Die Werte kommen aus dem Stack-Environment
# in Komodo (komodo.env), dort werden auch BIND_ADDR und PORT gesetzt.
# Lokal: .env nach .env.example anlegen – ohne BIND_ADDR bleibt die App auf 127.0.0.1.
# Fertiges Image:  docker compose pull && docker compose up -d
# Selbst bauen:    docker compose up --build -d
services:
  lebenslinien:
    image: ghcr.io/edgarm73/lebenslinien:latest
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /data
      APP_REGISTRATION_KEY: ${APP_REGISTRATION_KEY:?Set APP_REGISTRATION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ALLOWED_GRAMPS_HOSTS: ${APP_ALLOWED_GRAMPS_HOSTS:-}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-0}
      APP_VIDEO_RETENTION_DAYS: ${APP_VIDEO_RETENTION_DAYS:-0}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - lebenslinien_data:/data

volumes:
  lebenslinien_data:
    name: lebenslinien_lebenslinien_data
