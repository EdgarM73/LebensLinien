name: Docker-Image

# Baut das fertige Image und lädt es nach ghcr.io/edgarm73/lebenslinien hoch.
# Tags: die Version aus package.json (z. B. 2026.11.01) und "latest".
on:
  push:
    tags: ['v*']          # bei jedem Release-Tag
  workflow_dispatch:      # zusätzlich per Knopfdruck (Actions → Docker-Image → Run workflow)

permissions:
  contents: read
  packages: write         # erlaubt das Hochladen in die GitHub Container Registry

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version aus package.json lesen
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3      # für arm64 (z. B. Raspberry Pi, ARM-NAS)
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/edgarm73/lebenslinien
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Lebenslinien
            org.opencontainers.image.description=Lebenslinien-Video aus einer Person in Gramps Web
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
